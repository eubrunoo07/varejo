spring:
  application:
    name: Catalog
  datasource:
    url: jdbc:postgresql://localhost:5555/catalog
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
varejo:
  config:
    kafka:
      server-url: "http://localhost:29092"
      topics:
        product-events: "product-events"

server:
  port: 8081
